<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="游戏截图：燃烧的红莲花海与荒原战场">
  <defs>
    <linearGradient id="s1sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#100416"/>
      <stop offset=".5" stop-color="#3c0a17"/>
      <stop offset=".78" stop-color="#8a1f14"/>
      <stop offset="1" stop-color="#1a060a"/>
    </linearGradient>
    <radialGradient id="s1sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd7a0" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#ff7a30" stop-opacity=".55"/>
      <stop offset="1" stop-color="#a81223" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s1ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0a10"/>
      <stop offset="1" stop-color="#080306"/>
    </linearGradient>
    <linearGradient id="s1petal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5c0714"/>
      <stop offset=".55" stop-color="#e1372a"/>
      <stop offset="1" stop-color="#ffd08a"/>
    </linearGradient>
    <filter id="s1blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="s1soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#s1sky)"/>
  <ellipse cx="740" cy="470" rx="520" ry="300" fill="url(#s1sun)"/>

  <!-- 远景废墟 -->
  <path d="M0 452 L 96 404 L 168 440 L 244 392 L 318 436 L 402 398 L 470 438 L 560 400 L 640 442 L 730 406 L 812 444 L 900 408 L 990 446 L 1080 410 L 1176 448 L 1280 416 L 1280 720 L 0 720 Z" fill="#1a0509" opacity=".9"/>
  <rect x="196" y="330" width="46" height="118" fill="#140409"/>
  <rect x="906" y="312" width="54" height="136" fill="#140409"/>
  <rect x="560" y="356" width="34" height="90" fill="#140409"/>

  <!-- 地面 -->
  <rect y="470" width="1280" height="250" fill="url(#s1ground)"/>
  <g stroke="#ff6a2a" stroke-opacity=".5" stroke-width="2" fill="none">
    <path d="M120 700 L 260 610 L 330 640 L 470 566"/>
    <path d="M760 700 L 880 616 L 980 650 L 1150 580"/>
    <path d="M420 700 L 520 650 L 640 668"/>
  </g>

  <!-- 大火 -->
  <g filter="url(#s1blur)" opacity=".55">
    <ellipse cx="740" cy="470" rx="300" ry="120" fill="#ff7a30"/>
    <ellipse cx="300" cy="500" rx="200" ry="80" fill="#ff5a2b"/>
    <ellipse cx="1080" cy="510" rx="220" ry="86" fill="#ff5a2b"/>
  </g>

  <!-- 中央红莲 -->
  <g transform="translate(740 430)">
    <g opacity=".9">
      <g fill="url(#s1petal)">
        <path d="M0 0 C 60 -44 82 -132 22 -242 C 8 -268 -8 -268 -22 -242 C -82 -132 -60 -44 0 0 Z" transform="rotate(-80) scale(.86)"/>
        <path d="M0 0 C 60 -44 82 -132 22 -242 C 8 -268 -8 -268 -22 -242 C -82 -132 -60 -44 0 0 Z" transform="rotate(80) scale(.86)"/>
        <path d="M0 0 C 66 -50 90 -146 24 -266 C 9 -294 -9 -294 -24 -266 C -90 -146 -66 -50 0 0 Z" transform="rotate(-50) scale(.96)"/>
        <path d="M0 0 C 66 -50 90 -146 24 -266 C 9 -294 -9 -294 -24 -266 C -90 -146 -66 -50 0 0 Z" transform="rotate(50) scale(.96)"/>
        <path d="M0 0 C 72 -54 98 -160 26 -290 C 10 -320 -10 -320 -26 -290 C -98 -160 -72 -54 0 0 Z"/>
      </g>
    </g>
    <g fill="#ffe0ab" opacity=".9">
      <path d="M0 0 C 22 -16 30 -48 8 -88 C 3 -98 -3 -98 -8 -88 C -30 -48 -22 -16 0 0 Z" transform="rotate(-30) scale(.5)"/>
      <path d="M0 0 C 22 -16 30 -48 8 -88 C 3 -98 -3 -98 -8 -88 C -30 -48 -22 -16 0 0 Z" transform="rotate(30) scale(.5)"/>
      <path d="M0 0 C 24 -18 32 -52 9 -95 C 3 -106 -3 -106 -9 -95 C -32 -52 -24 -18 0 0 Z" transform="scale(.54)"/>
    </g>
    <ellipse rx="40" ry="26" fill="#fff1d0" opacity=".35" filter="url(#s1soft)"/>
  </g>

  <!-- 人形剪影 -->
  <g transform="translate(430 560)">
    <ellipse cx="0" cy="96" rx="70" ry="16" fill="#000" opacity=".55"/>
    <path d="M-30 -78 C -14 -86 14 -86 30 -78 C 46 -62 56 -20 50 24 C 44 66 20 90 0 90 C -20 90 -44 66 -50 24 C -56 -20 -46 -62 -30 -78 Z" fill="#150409"/>
    <path d="M30 -78 C 46 -62 56 -20 50 24 C 44 66 20 90 0 90 L 0 -84 C 12 -84 24 -82 30 -78 Z" fill="#ff6a3d" opacity=".35"/>
    <circle cx="0" cy="-96" r="20" fill="#100307"/>
    <path d="M-22 -100 C -10 -128 14 -130 24 -104 C 18 -110 2 -112 -22 -100 Z" fill="#100307"/>
  </g>

  <!-- 火星 -->
  <g fill="#ffb270">
    <circle cx="200" cy="360" r="2.6" opacity=".8"/>
    <circle cx="980" cy="300" r="2.2" opacity=".7"/>
    <circle cx="1120" cy="420" r="2.8" opacity=".75"/>
    <circle cx="520" cy="270" r="2" opacity=".6"/>
    <circle cx="860" cy="220" r="2.4" opacity=".65"/>
    <circle cx="320" cy="480" r="2.2" opacity=".6"/>
    <circle cx="1180" cy="250" r="1.8" opacity=".5"/>
    <circle cx="640" cy="180" r="2" opacity=".55"/>
    <circle cx="90" cy="520" r="2.4" opacity=".6"/>
    <circle cx="760" cy="640" r="2" opacity=".45"/>
  </g>

  <!-- HUD -->
  <g opacity=".92">
    <rect x="36" y="30" width="320" height="58" rx="6" fill="#0b0508" fill-opacity=".72" stroke="#ff6a3d" stroke-opacity=".35"/>
    <circle cx="66" cy="59" r="20" fill="#1a060c" stroke="#ff8a5a" stroke-opacity=".7"/>
    <path d="M66 39 A 20 20 0 0 1 84 70" fill="none" stroke="#e1372a" stroke-width="4"/>
    <rect x="96" y="44" width="240" height="12" rx="6" fill="#2a0d12"/>
    <rect x="96" y="44" width="182" height="12" rx="6" fill="#e1372a"/>
    <rect x="96" y="64" width="240" height="8" rx="4" fill="#0e1a24"/>
    <rect x="96" y="64" width="206" height="8" rx="4" fill="#4fa8e0"/>
    <text x="112" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#ffd9c0">86%</text>
  </g>
  <g opacity=".92">
    <rect x="1044" y="34" width="200" height="200" rx="100" fill="#0b0508" fill-opacity=".6" stroke="#ff6a3d" stroke-opacity=".3"/>
    <circle cx="1144" cy="134" r="66" fill="#1a0a12"/>
    <path d="M1090 160 L 1144 92 L 1196 160 Z" fill="#7d1a12" opacity=".8"/>
    <circle cx="1144" cy="112" r="7" fill="#ffd08a"/>
    <circle cx="1116" cy="150" r="5" fill="#ff6a3d"/>
    <circle cx="1176" cy="146" r="5" fill="#e1372a"/>
  </g>
  <g opacity=".9">
    <rect x="494" y="640" width="292" height="60" rx="8" fill="#0b0508" fill-opacity=".7" stroke="#ff6a3d" stroke-opacity=".28"/>
    <g fill="#20111a" stroke="#ff8a5a" stroke-opacity=".4">
      <rect x="506" y="652" width="42" height="36" rx="6"/>
      <rect x="556" y="652" width="42" height="36" rx="6"/>
      <rect x="606" y="652" width="42" height="36" rx="6"/>
      <rect x="656" y="652" width="42" height="36" rx="6"/>
      <rect x="706" y="652" width="42" height="36" rx="6"/>
    </g>
    <g fill="#ff8a5a" opacity=".85">
      <circle cx="527" cy="670" r="8"/>
      <path d="M577 662 l 12 16 l -12 16 l -12 -16 Z"/>
      <circle cx="627" cy="670" r="9" fill="none" stroke="#ff8a5a" stroke-width="3"/>
      <path d="M677 660 l 4 20 l 18 -14 Z"/>
      <circle cx="727" cy="670" r="7" fill="#ffd08a"/>
    </g>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#ffd9c0" opacity=".85">
    <text x="470" y="608">红莲业火 · 焚天</text>
  </g>
</svg>
