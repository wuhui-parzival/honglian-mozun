  </defs>

  <rect width="1280" height="720" fill="url(#s5bg)"/>
  <g stroke="#2f4a63" stroke-opacity=".25">
    <path d="M0 90 H 1280 M0 180 H 1280 M0 270 H 1280 M0 360 H 1280 M0 450 H 1280 M0 540 H 1280 M0 630 H 1280"/>
    <path d="M160 0 V 720 M320 0 V 720 M480 0 V 720 M640 0 V 720 M800 0 V 720 M960 0 V 720 M1120 0 V 720"/>
