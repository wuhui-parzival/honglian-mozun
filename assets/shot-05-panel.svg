        <path d="M0 0 C 8 -6 12 -18 3 -32 C 1 -36 -1 -36 -3 -32 C -12 -18 -8 -6 0 0 Z" transform="rotate(62)"/>
        <path d="M0 0 C 9 -7 13 -20 3 -36 C 1 -40 -1 -40 -3 -36 C -13 -20 -9 -7 0 0 Z" transform="rotate(-28)"/>
