      <rect x="890" y="166" width="106" height="106" rx="8"/>
      <rect x="1008" y="166" width="106" height="106" rx="8"/>
      <rect x="1126" y="166" width="90" height="106" rx="8"/>
      <rect x="772" y="288" width="106" height="106" rx="8"/>
      <rect x="890" y="288" width="106" height="106" rx="8"/>
      <rect x="1008" y="288" width="106" height="106" rx="8"/>
      <rect x="1126" y="288" width="90" height="106" rx="8"/>
