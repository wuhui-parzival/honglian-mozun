    <rect x="200" y="540" width="220" height="14" rx="7" fill="#16303f"/>
    <rect x="200" y="540" width="150" height="14" rx="7" fill="url(#s5bar3)"/>
    <rect x="200" y="582" width="220" height="14" rx="7" fill="#16303f"/>
    <rect x="200" y="582" width="196" height="14" rx="7" fill="url(#s5bar1)"/>
