<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="游戏截图：角色境界与蛊虫面板界面">
  <defs>
    <linearGradient id="s5bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a24"/>
      <stop offset="1" stop-color="#070c12"/>
    </linearGradient>
    <linearGradient id="s5panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16232f"/>
      <stop offset="1" stop-color="#0d151d"/>
    </linearGradient>
    <radialGradient id="s5ring" cx=".5" cy=".5" r=".5">
      <stop offset=".6" stop-color="#ff7a45" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff7a45" stop-opacity=".45"/>
    </radialGradient>
    <linearGradient id="s5bar1" x1="0" y1="0" x2="1" y2="0">
