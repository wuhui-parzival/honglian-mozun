  <!-- 描述框 -->
  <rect x="528" y="446" width="688" height="212" rx="8" fill="#0b151d" stroke="#2f4a63" stroke-opacity=".7"/>
  <text x="552" y="484" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#9fe9ff">红莲蛊 · 说明</text>
  <g font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#a8bccb">
    <text x="552" y="518">九转本命蛊，火道与魔道交汇之物。</text>
    <text x="552" y="546">以自身道痕为薪，燃尽一域气运，可焚烧对手道果。</text>
    <text x="552" y="574">代价：每次动用，燃损一层功德，永久不可恢复。</text>
    <text x="552" y="602">共鸣蛊虫：血海蛊、狂魔蛊、大衍蛊。</text>
  </g>
  <rect x="552" y="620" width="180" height="34" rx="6" fill="#1b2b3a" stroke="#4fa8e0" stroke-opacity=".6"/>
  <text x="642" y="643" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#9fe9ff">启用 本命蛊</text>
  <rect x="752" y="620" width="180" height="34" rx="6" fill="#1b2b3a" stroke="#6a8f3a" stroke-opacity=".6"/>
  <text x="842" y="643" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#c8e07a">炼化 新蛊</text>
